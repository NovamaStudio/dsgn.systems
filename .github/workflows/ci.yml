# Build and test on every push and pull request.
# A version tag (v1.2.3, must match package.json) publishes the package to npm and the docs to GitHub Pages.
# One-time setup: repository secret NPM_TOKEN (npm automation token), and Settings → Pages → Source: GitHub Actions.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test                      # build + contrast + lint + 2 px grid + accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            dist/contrast-report.md
            dist/a11y-report.md
            dist/a11y/
            dist/docs.html

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }   # id-token: npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"   # tag must match package.json
      - run: npm publish --ignore-scripts                                                   # tests already ran in the test job
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }

  pages:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test && node build/docs.mjs        # docs embed the fresh accessibility report
      - run: mkdir site && cp dist/docs.html site/index.html && cp dist/preview.html dist/layout-demo.html site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
