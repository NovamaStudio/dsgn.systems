# Build and test on every push and pull request.
# Every push to main deploys the docs to GitHub Pages; a version tag (v1.2.3, must match package.json) publishes to npm.
# npm publishing uses trusted publishing (OIDC): no token or secret. One-time setup on npmjs.com →
# package dsgn.systems → Settings → Trusted Publisher: GitHub Actions, NovamaStudio / dsgn.systems / ci.yml.
# GitHub: Settings → Pages → Source: GitHub Actions.
name: ci
on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test                      # build + contrast + lint + 2 px grid + accessibility
      - run: git diff --exit-code -- figma-plugin/   # the committed Figma plugin must match the build
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: |
            dist/contrast-report.md
            dist/a11y-report.md
            dist/a11y/
            dist/docs.html

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }   # id-token: trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }   # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run build
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"   # tag must match package.json
      - name: publish (skipped when this version is already on npm)
        run: |
          if npm view "dsgn.systems@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "dsgn.systems@${GITHUB_REF_NAME#v} is already published"
          else
            npm publish --ignore-scripts   # tests already ran in the test job
          fi

  pages:            # the docs follow main, so they are always current
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test && node build/docs.mjs        # docs embed the fresh accessibility report
      - run: mkdir site && cp dist/docs.html site/index.html && cp dist/preview.html dist/layout-demo.html site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
